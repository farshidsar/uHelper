name: shell-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck
      - name: Shell syntax
        run: bash -n uHelper.sh lib/*.sh
      - name: ShellCheck
        run: shellcheck lib/*.sh
      - name: Bats
        run: bats tests/bats
